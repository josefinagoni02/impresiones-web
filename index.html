<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Impresiones · Fotografía</title>
<meta name="description" content="Fotografías impresas en marco o canvas. Recorré el atlas de obras y probalas en tu pared.">
<meta property="og:title" content="Impresiones">
<meta property="og:description" content="Fotografías impresas en marco o canvas. Recorré el atlas de obras y probalas en tu pared.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: a gallery wall. Catálogo = filtros | mapa/grilla | ficha. Probador = pared | obras. Una sola paleta clara, deliberada. */
:root{
  --wall:#e8e3db; --paper:#f4f1ec; --card:#faf8f4; --ink:#1d1b19; --muted:#6b645a; --faint:#9a9184;
  --line:#dcd5ca; --soft:#ebe6de; --glass:rgba(255,253,249,.9); --on-ink:#faf8f4;
  --display:'Instrument Serif',Georgia,'Times New Roman',serif;
  --body:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'Geist Mono',ui-monospace,Menlo,Consolas,monospace;
  --hdr:64px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit}
img{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
[hidden]{display:none!important}
.serif{font-family:var(--display);font-weight:400}
.mono{font-family:var(--mono)}
.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* header */
header.top{position:sticky;top:0;z-index:30;height:calc(var(--hdr) + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) clamp(16px,3vw,48px) 0;display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--paper);border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-size:28px;letter-spacing:-.01em;text-decoration:none;white-space:nowrap}
nav.main{display:flex;gap:clamp(14px,3vw,36px);font-size:14px;letter-spacing:.03em}
nav.main a{text-decoration:none;color:var(--muted);padding:10px 0}
nav.main a[aria-current="page"]{color:var(--ink);box-shadow:inset 0 -1.5px 0 var(--ink)}
@media (max-width:560px){nav.main .hide-s{display:none}.brand{font-size:24px}}

/* shared controls */
.chip{height:40px;padding:0 15px;border-radius:99px;border:1px solid var(--line);font-size:14px;white-space:nowrap;display:inline-flex;align-items:center;gap:8px;transition:background .2s,color .2s,border-color .2s}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.dotbtn{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.dotbtn span{width:26px;height:26px;border-radius:50%;border:1px solid rgba(0,0,0,.14);transition:box-shadow .2s}
.dotbtn[aria-pressed="true"] span{box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--ink)}
.search{height:44px;border:1px solid var(--line);border-radius:99px;background:var(--card);display:flex;align-items:center;gap:10px;padding:0 16px}
.search input{border:0;background:transparent;outline:none;flex:1;min-width:0;font-size:14px}
.btn{height:46px;padding:0 20px;border-radius:99px;display:inline-flex;align-items:center;justify-content:center;gap:10px;font-size:14px;text-decoration:none;border:1px solid var(--ink);white-space:nowrap}
.btn.solid{background:var(--ink);color:var(--on-ink)}
.seg{display:inline-flex;gap:4px;padding:4px;border-radius:99px;background:var(--glass);box-shadow:0 8px 22px -12px rgba(40,30,20,.35)}
.seg button{height:38px;padding:0 15px;border-radius:99px;font-size:13px;display:inline-flex;align-items:center;gap:8px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}

/* ================= CATÁLOGO ================= */
#v-catalogo{display:grid;grid-template-columns:270px minmax(0,1fr) 390px;height:calc(100dvh - var(--hdr) - env(safe-area-inset-top,0px));min-height:620px;background:#efeae1}
.filters{padding:32px 28px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:26px;overflow:auto}
.filters h1{margin:0;font-family:var(--display);font-weight:400;font-size:60px;line-height:.9;letter-spacing:-.02em}
.filters p{margin:0;color:#5d564c;font-size:14px}
.fgroup{display:flex;flex-direction:column;gap:10px}
.fgroup .row{display:flex;flex-wrap:wrap;gap:8px}
.fgroup .row.dots{gap:2px}
.count{margin-top:auto;font-family:var(--mono);font-size:12px;color:var(--muted)}
.center{position:relative;min-width:0;overflow:hidden}
.viewtoggle{position:absolute;right:20px;top:18px;z-index:5}
.map{position:absolute;inset:0}
.map .gl{position:absolute;background:#dcd4c6}
.map .gl.v{top:24px;bottom:24px;width:1px}
.map .gl.h{left:24px;right:24px;height:1px}
.map .gl.eq{background:#cbbfae}
.map .gt{position:absolute;font-family:var(--mono);font-size:10px;color:var(--faint);pointer-events:none}
.map .ocean{position:absolute;font-family:var(--display);font-style:italic;font-size:22px;color:#b1a898;pointer-events:none;white-space:nowrap}
.map .scale{position:absolute;right:28px;bottom:22px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--faint)}
.pin{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;transition:opacity .3s}
.pin .ring{position:absolute;left:50%;top:50%;border-radius:50%;transform:translate(-50%,-50%);border:1px solid rgba(29,27,25,.35);transition:all .35s}
.pin .core{position:absolute;left:50%;top:50%;border-radius:50%;transform:translate(-50%,-50%);background:var(--ink);color:var(--on-ink);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px}
.pin .lbl{position:absolute;top:50%;transform:translateY(-50%);white-space:nowrap;font-family:var(--display);font-style:italic;font-size:22px;color:var(--muted);transition:color .3s}
.pin.l .lbl{right:44px}.pin.r .lbl{left:44px}
.pin.act .ring{border-color:var(--ink);background:rgba(29,27,25,.06)}
.pin.act .lbl{color:var(--ink)}
.grid{position:absolute;inset:0;overflow:auto;padding:76px 28px 32px 64px}
.grid .ns{position:absolute;left:26px;top:84px;bottom:32px;display:flex;flex-direction:column;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--faint)}
.grid .ns i{flex:1;width:1px;background:#cfc6b8}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:28px 16px}
.card{display:flex;flex-direction:column;gap:8px;text-align:left}
.card .cc{font-family:var(--mono);font-size:10px;letter-spacing:.03em;color:#8a8175}
.card .ph{aspect-ratio:4/5;overflow:hidden;background:var(--soft);box-shadow:0 10px 20px -12px rgba(40,30,20,.5);transition:box-shadow .3s}
.card .ph img{width:100%;height:100%;object-fit:cover;transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.card:hover .ph img{transform:scale(1.05)}
.card .ct{font-family:var(--display);font-style:italic;font-size:24px;line-height:1}
.card .cp{font-size:11px;color:var(--muted);margin-top:-4px}
.card.act .ph{box-shadow:0 0 0 2px #efeae1,0 0 0 4px var(--ink)}
.card.act .cc{color:var(--ink)}
.empty{padding:48px 8px;font-family:var(--display);font-style:italic;font-size:28px;color:var(--muted)}
.ficha{border-left:1px solid var(--line);background:var(--card);padding:28px 32px;display:flex;flex-direction:column;gap:18px;overflow:auto}
.ficha .pic{height:280px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:#e6e0d5}
.ficha .pic img{max-height:248px;max-width:88%;box-shadow:0 18px 30px -14px rgba(40,30,20,.5)}
.ficha h2{margin:0;font-family:var(--display);font-weight:400;font-style:italic;font-size:54px;line-height:.95;letter-spacing:-.02em;text-wrap:balance}
.ficha .meta{font-family:var(--mono);font-size:12px;letter-spacing:.05em;color:var(--muted)}
.ficha .place{font-size:14px;color:#4a443c}
.ficha .phrase{margin:0;font-family:var(--display);font-size:23px;line-height:1.3}
.ficha .story{margin:0;font-size:14px;line-height:1.6;color:#4a443c}
.ficha .group{display:flex;gap:8px;flex-wrap:wrap}
.ficha .group button{width:46px;height:58px;overflow:hidden;opacity:.6;transition:opacity .2s,box-shadow .2s}
.ficha .group button img{width:100%;height:100%;object-fit:cover}
.ficha .group button[aria-pressed="true"]{opacity:1;box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--ink)}
.ficha .acts{margin-top:auto;display:flex;flex-wrap:wrap;gap:10px;padding-top:6px}
.ficha .tags{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
@media (max-width:1100px){#v-catalogo{grid-template-columns:230px minmax(0,1fr) 330px}.ficha h2{font-size:44px}}
@media (max-width:900px){
  #v-catalogo{display:flex;flex-direction:column;height:auto;min-height:0}
  .filters{border-right:0;border-bottom:1px solid var(--line);padding:24px 16px 16px;gap:14px}
  .filters h1{font-size:48px}
  .fgroup .row{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
  .fgroup .eyebrow{display:none}
  .count{margin-top:0}
  .center{height:auto}
  .center.is-map{height:min(78vh,640px)}
  .viewtoggle{position:relative;right:auto;top:auto;margin:14px 16px 0;display:inline-flex}
  .center.is-map .map{top:66px}
  .grid{padding-top:16px!important}
  .grid{position:static;padding:64px 16px 24px}
  .grid .ns{display:none}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ficha{border-left:0;border-top:1px solid var(--line);padding:24px 16px 40px}
  .pin .lbl{font-size:17px}
  .map .ocean{font-size:16px}
}

/* ================= PROBADOR ================= */
#v-probador{display:grid;grid-template-columns:minmax(0,1fr) 360px;height:calc(100dvh - var(--hdr) - env(safe-area-inset-top,0px));min-height:640px}
.stage{position:relative;min-width:0;background:radial-gradient(ellipse 46% 60% at 50% 42%,rgba(255,248,232,.95) 0%,rgba(255,248,232,0) 72%),var(--wall);overflow:hidden}
.stage .head{position:absolute;left:36px;top:28px;display:flex;flex-direction:column;gap:6px;max-width:60%;z-index:2}
.stage .head h1{margin:0;font-family:var(--display);font-weight:400;font-style:italic;font-size:56px;line-height:.95;letter-spacing:-.02em}
.wallarea{position:absolute;left:0;right:0;top:130px;bottom:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.ruler{display:flex;flex-direction:column;align-items:center;gap:6px;color:#5d564c;transition:width .5s cubic-bezier(.2,.7,.2,1)}
.ruler span{font-size:12px;letter-spacing:.08em}
.ruler div{width:100%;height:8px;border-left:1px solid currentColor;border-right:1px solid currentColor;display:flex;align-items:center}
.ruler div i{flex:1;border-top:1px dashed currentColor}
.comp{display:flex;align-items:flex-start}
.piece{display:flex;flex-direction:column;align-items:center;gap:16px}
.piece .ring{outline:1px dashed transparent;outline-offset:12px;transition:outline-color .3s}
.piece.act .ring{outline-color:var(--ink)}
.piece .fr,.piece .mt,.piece .bx{transition:all .5s cubic-bezier(.2,.7,.2,1)}
.piece .bx{position:relative;overflow:hidden;background:#efece6}
.piece .bx img{position:absolute;left:50%;top:50%;max-width:none;transition:all .5s cubic-bezier(.2,.7,.2,1)}
.piece .pl{font-size:12px;letter-spacing:.06em;color:#8a8175}
.piece.act .pl{color:var(--ink);font-weight:500}
.dock{position:absolute;left:20px;right:20px;bottom:24px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;z-index:4}
.dgroup{display:flex;flex-direction:column;gap:6px}
.dgroup .eyebrow{padding:0 14px}
.dgroup.right{align-items:flex-end}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 12px 32px -14px rgba(40,30,20,.35)}
.pill{display:flex;align-items:center;gap:2px;padding:5px;border-radius:99px}
.pill .seg2{height:42px;padding:0 16px;border-radius:99px;font-size:14px}
.pill .seg2[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.bar{display:flex;align-items:center;gap:2px;padding:5px 6px;border-radius:99px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.sec{height:42px;padding:0 12px;border-radius:99px;display:flex;align-items:center;gap:8px;flex-shrink:0;transition:background .2s}
.sec:hover,.sec[aria-expanded="true"]{background:rgba(0,0,0,.06)}
.sec .sl{display:flex;flex-direction:column;align-items:flex-start;line-height:1.1}
.sec .sl small{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sec .sl b{font-weight:400;font-size:14px;white-space:nowrap}
.sec .sw{width:18px;height:18px;border-radius:50%;border:1px solid rgba(0,0,0,.15);flex-shrink:0}
.sec svg.ch{transition:transform .3s}
.sec[aria-expanded="true"] svg.ch{transform:rotate(180deg)}
.vr{width:1px;height:26px;margin:0 4px;background:rgba(0,0,0,.14);flex-shrink:0}
.qty{display:flex;align-items:center;gap:2px;padding:5px;border-radius:99px}
.qty button{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.qty button:disabled{opacity:.3;cursor:default}
.qty .qd{display:flex;gap:4px;padding:0 6px}
.qty .qd span{border-radius:2px;box-sizing:border-box}
.tray{position:absolute;left:50%;bottom:112px;transform:translateX(-50%);padding:16px 18px;border-radius:18px;display:flex;flex-direction:column;gap:12px;z-index:5;max-width:calc(100% - 32px)}
.tray .opts{display:flex;gap:6px;flex-wrap:wrap}
.opt{width:72px;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;color:#4a443c;position:relative}
.opt .s{width:34px;height:34px;border-radius:50%;border:1px solid rgba(0,0,0,.15);transition:box-shadow .2s;display:flex;align-items:center;justify-content:center}
.opt .s.sq{border-radius:6px}
.opt[aria-pressed="true"] .s{box-shadow:0 0 0 3px #fdfbf7,0 0 0 5px var(--ink)}
.opt input[type=color]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
.tray .hint{font-size:12px;color:var(--muted)}
.tray .rot{display:flex;align-items:center;gap:6px}
.round{width:44px;height:44px;border-radius:50%;border:1px solid rgba(0,0,0,.16);display:flex;align-items:center;justify-content:center}
.pside{border-left:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;min-height:0}
.tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-bottom:1px solid var(--line);flex-shrink:0}
.tabs button{height:54px;font-size:14px;letter-spacing:.04em;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--ink)}
.plist{flex:1;min-height:0;overflow:auto;padding:0 12px 12px}
.phelp{margin:0;padding:16px 16px 8px;font-size:13px;color:var(--muted)}
.prow{width:100%;height:72px;display:flex;align-items:center;gap:14px;padding:0 12px;border-radius:10px;text-align:left;transition:background .2s}
.prow:hover,.prow.on{background:#f1ede6}
.prow .th{width:56px;height:56px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.prow .th img{box-shadow:0 6px 14px -6px rgba(0,0,0,.35);object-fit:cover}
.prow .pt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.prow .pt b{font-family:var(--display);font-weight:400;font-size:23px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .pt small{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{min-width:26px;height:26px;padding:0 8px;border-radius:99px;background:var(--ink);color:var(--on-ink);font-size:12px;display:flex;align-items:center;justify-content:center}
.setcard{width:100%;margin-top:10px;padding:14px;border-radius:12px;border:1px solid var(--line);background:#fff;display:flex;gap:14px;align-items:center;text-align:left}
.setcard.on{border-color:var(--ink)}
.setcard .mini{width:104px;height:64px;flex-shrink:0;border-radius:6px;background:var(--soft);display:flex;align-items:center;justify-content:center;gap:5px}
.setcard .mini img{object-fit:cover;box-shadow:0 3px 6px -2px rgba(0,0,0,.35)}
.setcard b{font-family:var(--display);font-weight:400;font-size:23px;line-height:1;display:block}
.setcard small{font-size:12px;color:var(--muted)}
.pfoot{padding:18px 24px 22px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px;flex-shrink:0}
.pfoot .sum{font-size:13px;color:#4a443c}
@media (max-width:900px){
  #v-probador{display:flex;flex-direction:column;height:auto;min-height:0}
  .stage{height:auto;overflow:visible;display:flex;flex-direction:column}
  .stage .head{position:static;padding:20px 16px 0;max-width:none}
  .stage .head h1{font-size:40px}
  .wallarea{position:relative;top:auto;bottom:auto;height:58vh;min-height:340px;padding:12px 0}
  .dock{position:static;flex-wrap:wrap;padding:0 12px 16px;justify-content:center}
  .dgroup .eyebrow{display:none}
  .bar{order:3;width:100%}
  .tray{position:static;transform:none;margin:0 12px 12px;max-width:none}
  .pside{border-left:0;border-top:1px solid var(--line)}
  .plist{max-height:60vh}
}

/* ================= SOBRE / CONTACTO ================= */
.about{padding:clamp(56px,8vw,112px) clamp(16px,3vw,48px);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;border-top:1px solid var(--line)}
.about h2{margin:0 0 20px;font-family:var(--display);font-weight:400;font-size:clamp(44px,6vw,80px);line-height:.9;letter-spacing:-.02em}
.about p{margin:0;max-width:56ch;font-size:16px;line-height:1.65;color:#3f3a33;white-space:pre-line}
.contact{display:flex;flex-direction:column;gap:14px;align-self:end}
.contact .ln{display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line);font-size:15px;text-decoration:none}
.contact .ln span:first-child{color:var(--muted);font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding-top:3px}
footer.bottom{padding:24px clamp(16px,3vw,48px) calc(24px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;gap:16px;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}
@media (max-width:760px){.about{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#catalogo" id="brand">Impresiones</a>
  <nav class="main">
    <a href="#catalogo" data-route="catalogo">Catálogo</a>
    <a href="#probador" data-route="probador">Probador</a>
    <a href="#sobre" class="hide-s">Sobre mí</a>
    <a href="#contacto">Contacto</a>
  </nav>
</header>

<main id="v-catalogo" aria-label="Catálogo">
  <aside class="filters">
    <div style="display:flex;flex-direction:column;gap:10px">
      <h1>Atlas</h1>
      <p>Cada punto es un lugar donde tomé fotos. Recorré el mapa, o miralas de norte a sur.</p>
    </div>
    <label class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6b645a" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" type="search" placeholder="Nombre o lugar" aria-label="Buscar por nombre o lugar"></label>
    <div class="fgroup"><span class="eyebrow">Serie</span><div class="row" id="fSeries"></div></div>
    <div class="fgroup"><span class="eyebrow">Tono</span><div class="row dots" id="fTones"></div></div>
    <span class="count" id="count"></span>
  </aside>
  <div class="center" id="center">
    <div class="seg viewtoggle" role="group" aria-label="Vista">
      <button id="vMap" aria-pressed="true"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg>Mapa</button>

<script>
(() => {
  const D = JSON.parse(document.getElementById('data').textContent);
  const W = D.works, C = D.config;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const mob = () => window.matchMedia('(max-width:900px)').matches;

  /* ---------- routing ---------- */
  function route() {
    const r = location.hash === '#probador' ? 'probador' : location.hash === '#sobre' || location.hash === '#contacto' ? null : 'catalogo';
    if (!r) return;
    $('v-catalogo').hidden = r !== 'catalogo';
    $('v-probador').hidden = r !== 'probador';
    document.querySelectorAll('nav.main a[data-route]').forEach((a) => a.setAttribute('aria-current', a.dataset.route === r ? 'page' : 'false'));
    if (r === 'probador') renderP();
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route);

  /* ================= CATÁLOGO ================= */
  const TONES = D.tones;
  const SERIES = ['Todas'].concat([...new Set(W.map((w) => w.serie).filter(Boolean))]);
  const cs = { view: 'map', sel: 0, hover: null, serie: 0, tone: 0, q: '' };
  const regions = [];
  W.forEach((w, i) => { let r = regions.find((x) => x.name === w.region); if (!r) { r = { name: w.region, ids: [] }; regions.push(r); } r.ids.push(i); });
  const E = D.extent;
  const px = (lon) => (lon - E.lon0) / (E.lon1 - E.lon0);
  const py = (lat) => (E.lat0 - lat) / (E.lat0 - E.lat1);
  regions.forEach((r) => {
    r.lat = r.ids.reduce((a, i) => a + W[i].lat, 0) / r.ids.length;
    r.lon = r.ids.reduce((a, i) => a + W[i].lon, 0) / r.ids.length;
    r.x = px(r.lon); r.y = py(r.lat);
  });
  for (let k = 0; k < 40; k++) { // separate crowded pins
    for (let a = 0; a < regions.length; a++) for (let b = a + 1; b < regions.length; b++) {
      const A = regions[a], B = regions[b]; const dx = B.x - A.x, dy = B.y - A.y; const d = Math.hypot(dx, dy) || 1e-6; const min = 0.065;
      if (d < min) { const p = (min - d) / 2; A.x -= dx / d * p; A.y -= dy / d * p; B.x += dx / d * p; B.y += dy / d * p; }
    }
  }
  regions.forEach((r) => { r.side = r.x > 0.62 ? 'l' : 'r'; });
  // put the left-most of a close horizontal pair on the left
  regions.forEach((r) => { const n = regions.find((o) => o !== r && Math.abs(o.y - r.y) < 0.06 && o.x > r.x && o.x - r.x < 0.12); if (n) { r.side = 'l'; n.side = 'r'; } });

  const match = (w) => (cs.serie === 0 || w.serie === SERIES[cs.serie]) && (cs.tone === 0 || w.tones.includes(TONES[cs.tone].id)) && (!cs.q || w.t.toLowerCase().includes(cs.q) || w.place.toLowerCase().includes(cs.q));
  const shownC = () => (cs.hover !== null ? cs.hover : cs.sel);

  function renderFilters() {
    $('fSeries').innerHTML = SERIES.map((s, i) => `<button class="chip" data-serie="${i}" aria-pressed="${i === cs.serie}">${esc(s)}</button>`).join('');
    $('fTones').innerHTML = TONES.map((t, i) => `<button class="dotbtn" data-tone="${i}" aria-pressed="${i === cs.tone}" aria-label="${esc(t.label)}" title="${esc(t.label)}"><span style="background:${t.c}"></span></button>`).join('');
    const n = W.filter(match).length;
    $('count').textContent = `${n} de ${W.length} obras · ${regions.length} lugares`;
  }
  function renderMap() {
    let h = '';
    for (let lon = Math.ceil(E.lon0 / 20) * 20; lon <= E.lon1; lon += 20) { const x = px(lon) * 100; if (x < 3 || x > 97) continue; h += `<div class="gl v" style="left:${x}%"></div><span class="gt" style="left:calc(${x}% + 6px);top:28px">${Math.abs(lon)}°O</span>`; }
    for (let lat = Math.floor(E.lat0 / 20) * 20; lat >= E.lat1; lat -= 20) { const y = py(lat) * 100; if (y < 3 || y > 97) continue; h += `<div class="gl h${lat === 0 ? ' eq' : ''}" style="top:${y}%"></div><span class="gt" style="left:28px;top:calc(${y}% - 16px)">${lat === 0 ? '0° · ECUADOR' : Math.abs(lat) + (lat > 0 ? '°N' : '°S')}</span>`; }
    D.oceans.forEach((o) => { const x = px(o.lon), y = py(o.lat); if (x > 0.05 && x < 0.8 && y > 0.05 && y < 0.95) h += `<span class="ocean" style="left:${x * 100}%;top:${y * 100}%">${esc(o.name)}</span>`; });
    const sh = shownC();
    regions.forEach((r, ri) => {
      const hits = r.ids.filter((i) => match(W[i])); const on = hits.length > 0; const act = r.ids.includes(sh); const multi = r.ids.length > 1;
      const size = multi ? 26 : 12; const ring = act ? size + 22 : size + 8;
      h += `<button class="pin ${r.side}${act ? ' act' : ''}" data-region="${ri}" style="left:${r.x * 100}%;top:${r.y * 100}%;opacity:${on ? 1 : 0.18};pointer-events:${on ? 'auto' : 'none'}" aria-label="${esc(multi ? r.ids.length + ' obras en ' + r.name : W[r.ids[0]].t + ', ' + W[r.ids[0]].place)}">
        <span class="ring" style="width:${ring}px;height:${ring}px"></span><span class="core" style="width:${size}px;height:${size}px">${multi ? (on ? hits.length : r.ids.length) : ''}</span>
        <span class="lbl">${esc(multi ? r.name : W[r.ids[0]].t)}</span></button>`;
    });
    h += `<span class="scale">ESC. ILUSTRATIVA · AMÉRICA</span>`;
    $('map').innerHTML = h;
  }
  function renderGrid() {
    const sh = shownC();
    const ids = W.map((w, i) => i).filter((i) => match(W[i])).sort((a, b) => W[b].lat - W[a].lat);
    $('cards').innerHTML = ids.length ? ids.map((i) => { const w = W[i]; return `<button class="card${i === sh ? ' act' : ''}" data-work="${i}" aria-label="${esc(w.t + ', ' + w.place)}"><span class="cc">${esc(w.coords)}</span><span class="ph"><img src="${w.sm}" alt="" loading="lazy"></span><span class="ct">${esc(w.t)}</span><span class="cp">${esc(w.place.split(',')[0])}</span></button>`; }).join('') : '<p class="empty">Ninguna obra coincide con esos filtros.</p>';
  }
  function renderFicha() {
    const i = shownC(), w = W[i];
    const reg = regions.find((r) => r.name === w.region);
    const story = w.story ? `<p class="story">${esc(w.story)}</p>` : '';
    const group = reg.ids.length > 1 ? `<div style="display:flex;flex-direction:column;gap:8px"><span class="eyebrow mono">${reg.ids.length} obras en ${esc(reg.name)}</span><div class="group">${reg.ids.map((k) => `<button data-pick="${k}" aria-pressed="${k === i}" aria-label="Ver ${esc(W[k].t)}"><img src="${W[k].sm}" alt="" loading="lazy"></button>`).join('')}</div></div>` : '';
    $('ficha').innerHTML = `<div class="pic"><img src="${w.sm}" alt="${esc(w.t)}"></div>${group}
      <div style="display:flex;flex-direction:column;gap:8px"><span class="meta">N.º ${String(i + 1).padStart(2, '0')} · ${esc(w.coords)}</span><h2>${esc(w.t)}</h2><span class="place">${esc(w.place)}${w.year ? ' · ' + w.year : ''}${w.when ? ' · ' + esc(w.when) : ''}</span></div>
      ${w.text ? `<p class="phrase">“${esc(w.text)}”</p>` : ''}${story}
      <div class="tags"><span>Serie ${esc(w.serie || '—')}</span>${w.moods.map((m) => `<span>· ${esc(m)}</span>`).join('')}</div>
      <div class="acts"><a class="btn solid" href="#probador" data-try="${i}">Probar en mi pared →</a><a class="btn" href="${esc(consultLink(w.t))}" target="_blank" rel="noopener">Consultar</a></div>`;
  }
  function renderC() { renderFilters(); if (cs.view === 'map') renderMap(); else renderGrid(); renderFicha(); }
  function setView(v) {
    cs.view = v; $('vMap').setAttribute('aria-pressed', v === 'map'); $('vGrid').setAttribute('aria-pressed', v === 'grid');
    $('map').hidden = v !== 'map'; $('grid').hidden = v !== 'grid'; $('center').classList.toggle('is-map', v === 'map'); renderC();
  }
  $('vMap').onclick = () => setView('map');
  $('vGrid').onclick = () => setView('grid');
  $('q').addEventListener('input', (e) => { cs.q = e.target.value.trim().toLowerCase(); renderC(); });
  $('v-catalogo').addEventListener('click', (e) => {
    const t = e.target.closest('[data-serie],[data-tone],[data-region],[data-work],[data-pick],[data-try]'); if (!t) return;
    if (t.dataset.serie) cs.serie = +t.dataset.serie;
    else if (t.dataset.tone) cs.tone = +t.dataset.tone;
    else if (t.dataset.region) { const r = regions[+t.dataset.region]; const hits = r.ids.filter((i) => match(W[i])); cs.sel = hits[0] ?? r.ids[0]; cs.hover = null; if (mob()) setTimeout(() => $('ficha').scrollIntoView({ behavior: 'smooth' }), 30); }
    else if (t.dataset.work) { cs.sel = +t.dataset.work; cs.hover = null; if (mob()) setTimeout(() => $('ficha').scrollIntoView({ behavior: 'smooth' }), 30); }
    else if (t.dataset.pick) { cs.sel = +t.dataset.pick; cs.hover = null; }
    else if (t.dataset.try) { tryOn(+t.dataset.try); return; }
    renderC();
  });
  $('v-catalogo').addEventListener('mouseover', (e) => {
    if (mob()) return;
    const t = e.target.closest('[data-region],[data-work]'); if (!t) return;
    const v = t.dataset.region ? (regions[+t.dataset.region].ids.find((i) => match(W[i])) ?? regions[+t.dataset.region].ids[0]) : +t.dataset.work;
    if (cs.hover !== v) { cs.hover = v; renderFicha(); if (cs.view === 'map') renderMap(); else renderGrid(); }
  });
  $('center').addEventListener('mouseleave', () => { if (cs.hover !== null) { cs.hover = null; renderC(); } });

  /* ================= PROBADOR ================= */
  const FRAMES = [
    { id: 'negro', label: 'Negro', bg: '#1c1b1a' },
    { id: 'blanco', label: 'Blanco', bg: '#f2f0ec' },
    { id: 'roble', label: 'Roble', bg: 'repeating-linear-gradient(90deg,#b8905f 0 3px,#ad8454 3px 6px,#b38b5a 6px 8px)' },
    { id: 'nogal', label: 'Nogal', bg: 'repeating-linear-gradient(90deg,#5b3d28 0 3px,#523622 3px 6px)' }
  ];
  const MATS = [{ id: 'sin', label: 'Sin', long: 'Sin paspartú', c: null }, { id: 'blanco', label: 'Blanco', long: 'Blanco', c: '#fbfaf6' }, { id: 'negro', label: 'Negro', long: 'Negro', c: '#1f1e1c' }];
  const EDGES = [{ id: 'wrap', label: 'Envolvente' }, { id: 'blanco', label: 'Blanco', c: '#f2f0ec', cd: '#dcd8d0' }, { id: 'negro', label: 'Negro', c: '#1c1b1a', cd: '#0f0f0e' }];
  const ORIENTS = [{ id: 'v', label: 'Vertical', icon: [12, 17] }, { id: 'h', label: 'Horizontal', icon: [17, 12] }, { id: 'q', label: 'Cuadrado', icon: [14, 14] }];
  const SIZES = { v: [[30, 45], [50, 75], [70, 105]], h: [[45, 30], [75, 50], [105, 70]], q: [[30, 30], [50, 50], [70, 70]] };
  const NAMES = ['', 'Obra única', 'Díptico', 'Tríptico'];
  const first3 = W.map((w, i) => i).filter((i) => W[i].fmt === W[0].fmt).slice(0, 3);
  const ps = { qty: 1, slots: [first3[0] ?? 0, first3[1] ?? 1, first3[2] ?? 2], rot: [0, 0, 0], fit: 'cover', active: 0, hover: null, orient: W[0].fmt, size: 1, finish: 'marco', frame: 'negro', custom: '#7a5c8e', mat: 'blanco', edge: 'wrap', open: null, tab: 'obras', set: null };
  const up = (patch) => { Object.assign(ps, { set: null }, patch); renderP(); };
  const frameOf = () => (ps.frame === 'custom' ? { id: 'custom', label: 'A medida', bg: ps.custom } : FRAMES.find((f) => f.id === ps.frame));
  const shownP = (i) => (i === ps.active && ps.hover !== null ? ps.hover : ps.slots[i]);
  const chev = '<svg class="ch" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>';

  function tryOn(i) {
    ps.slots[ps.active] = i; ps.rot[ps.active] = 0; ps.orient = W[i].fmt; ps.hover = null; ps.set = null;
    location.hash = '#probador';
  }

  function renderPieces() {
    const isM = ps.finish === 'marco';
    const d = SIZES[ps.orient][ps.size];
    const fr = frameOf(); const mt = MATS.find((m) => m.id === ps.mat); const ed = EDGES.find((e) => e.id === ps.edge);
    const fcm = isM ? 3 : 0, mcm = isM && mt.c ? 6 : 0, gap = 10;
    const pw = d[0] + 2 * (fcm + mcm), ph = d[1] + 2 * (fcm + mcm);
    const tot = ps.qty * pw + (ps.qty - 1) * gap;
    const wa = $('wallarea'); const aw = wa.clientWidth - (mob() ? 48 : 120); const ah = wa.clientHeight - (mob() ? 70 : 60);
    const sc = Math.max(0.5, Math.min(4.2, aw / tot, ah / ph));
    const BW = d[0] * sc, BH = d[1] * sc, multi = ps.qty > 1;
    let h = '';
    for (let i = 0; i < ps.qty; i++) {
      const w = W[shownP(i)], r = ps.rot[i], turned = r % 180 !== 0;
      const a = turned ? 1 / w.ar : w.ar, boxA = BW / BH, cover = ps.fit === 'cover';
      let dw, dh; if ((a > boxA) === cover) { dh = BH; dw = BH * a; } else { dw = BW; dh = BW / a; }
      const ew = turned ? dh : dw, eh = turned ? dw : dh;
      const eC = ps.edge === 'wrap' ? w.edge : ed.c, eD = ps.edge === 'wrap' ? w.edgeD : ed.cd;
      const frSt = isM ? `padding:${fcm * sc}px;background:${fr.bg};box-shadow:0 2px 3px rgba(0,0,0,.18),0 26px 44px -16px rgba(50,38,26,.45)` : `padding:0;border-right:${2.2 * sc}px solid ${eC};border-bottom:${2.2 * sc}px solid ${eD};box-shadow:0 26px 44px -16px rgba(50,38,26,.5)`;
      h += `<button class="piece${multi && i === ps.active ? ' act' : ''}" data-slot="${i}" aria-label="Lugar ${i + 1}: ${esc(w.t)}">
        <div class="ring"><div class="fr" style="${frSt}"><div class="mt" style="padding:${mcm * sc}px;background:${isM && mt.c ? mt.c : 'transparent'}">
        <div class="bx" style="width:${BW}px;height:${BH}px"><img src="${w.img}" alt="" style="width:${ew}px;height:${eh}px;transform:translate(-50%,-50%) rotate(${r}deg)"></div></div></div></div>
        ${multi ? `<span class="pl">${i + 1} · ${esc(w.t)}</span>` : ''}</button>`;
    }
    $('comp').innerHTML = h;
    $('comp').style.gap = gap * sc + 'px';
    $('ruler').style.width = tot * sc + 'px';
    $('rulerLbl').textContent = `${Math.round(tot)} cm de ancho total`;
    const names = ps.slots.slice(0, ps.qty).map((k) => W[k].t);
    $('pMeta').textContent = multi ? names.join(' · ') : [W[shownP(0)].serie, W[shownP(0)].place.split(',')[0]].filter(Boolean).join(' · ');
    $('pTitle').textContent = multi ? NAMES[ps.qty] : W[shownP(0)].t;
  }

  function renderDock() {
    const isM = ps.finish === 'marco';
    document.querySelectorAll('[data-a="finish"]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.v === ps.finish));
    const fr = frameOf(), mt = MATS.find((m) => m.id === ps.mat), ed = EDGES.find((e) => e.id === ps.edge), o = ORIENTS.find((x) => x.id === ps.orient), d = SIZES[ps.orient][ps.size];
    const cur = W[shownP(0)];
    const sec = (id, sw, small, big) => `<button class="sec" data-a="open" data-v="${id}" aria-expanded="${ps.open === id}">${sw}<span class="sl"><small>${small}</small><b>${esc(big)}</b></span>${chev}</button>`;
    let h = '';
    if (isM) {
      h += sec('marco', `<span class="sw" style="background:${fr.bg}"></span>`, 'Marco', fr.label);
      h += sec('mat', `<span class="sw" style="border-radius:3px;${mt.c ? 'background:' + mt.c : 'border:1px dashed #8a8175'}"></span>`, 'Paspartú', mt.label);
    } else {
      h += sec('edge', `<span class="sw" style="border-radius:2px;background:${ps.edge === 'wrap' ? `url(${cur.sm}) center/cover` : ed.c}"></span>`, 'Borde del canvas', ed.label);
    }
    h += '<span class="vr"></span>' + sec('format', `<span style="width:${o.icon[0]}px;height:${o.icon[1]}px;border:1.5px solid currentColor;border-radius:2px;flex-shrink:0"></span>`, 'Formato', `${o.label} · ${d[0]}×${d[1]}`);
    const cr = ps.rot[ps.qty > 1 ? ps.active : 0];
    h += '<span class="vr"></span>' + sec('img', '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="1"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-8 9"/></svg>', 'Imagen', `${ps.fit === 'cover' ? 'Llenar' : 'Completa'} · ${cr}°`);
    $('bar').innerHTML = h;
    const box = ps.orient === 'h' ? [14, 10] : ps.orient === 'q' ? [12, 12] : [10, 14];
    $('qd').innerHTML = [0, 1, 2].map((k) => `<span style="width:${box[0]}px;height:${box[1]}px;${k < ps.qty ? 'background:var(--ink);border:1.5px solid var(--ink)' : 'border:1.5px dashed #b3aa9d'}"></span>`).join('');
    const qb = document.querySelectorAll('[data-a="qty"]'); qb[0].disabled = ps.qty === 1; qb[1].disabled = ps.qty === 3;
    renderTray();
  }

  function renderTray() {
    const t = $('tray');
    if (!ps.open) { t.hidden = true; t.innerHTML = ''; return; }
    t.hidden = false;
    let h = '';
    if (ps.open === 'marco') {
      h = `<div class="opts">${FRAMES.map((f) => `<button class="opt" data-a="frame" data-v="${f.id}" aria-pressed="${f.id === ps.frame}"><span class="s" style="background:${f.bg}"></span>${f.label}</button>`).join('')}
        <label class="opt" aria-pressed="${ps.frame === 'custom'}"><span class="s" style="background:${ps.frame === 'custom' ? ps.custom : 'conic-gradient(#d9534f,#e8b04a,#8fbf6a,#4aa3c2,#7a5c8e,#d9534f)'}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span>A medida<input type="color" id="customColor" value="${ps.custom}" aria-label="Elegir color de marco a medida"></label></div>`;
    } else if (ps.open === 'mat') {
      h = `<div class="opts">${MATS.map((m) => `<button class="opt" data-a="mat" data-v="${m.id}" aria-pressed="${m.id === ps.mat}"><span class="s sq" style="${m.c ? 'background:' + m.c : 'border:1px dashed #8a8175'}"><span style="width:14px;height:14px;background:#9fb3b6"></span></span>${m.long}</button>`).join('')}</div>`;
    } else if (ps.open === 'edge') {
      const cur = W[shownP(0)];
      h = `<div class="opts">${EDGES.map((e) => `<button class="opt" data-a="edge" data-v="${e.id}" aria-pressed="${e.id === ps.edge}"><span class="s sq" style="background:${e.id === 'wrap' ? `url(${cur.sm}) center/cover` : e.c}"></span>${e.label}</button>`).join('')}</div>`;
    } else if (ps.open === 'format') {
      h = `<span class="hint">Forma del cuadro</span><div class="opts">${ORIENTS.map((o) => `<button class="chip" data-a="orient" data-v="${o.id}" aria-pressed="${o.id === ps.orient}"><span style="width:${o.icon[0]}px;height:${o.icon[1]}px;border:1.5px solid currentColor;border-radius:2px"></span>${o.label}</button>`).join('')}</div>
        <div class="opts">${SIZES[ps.orient].map((d, i) => `<button class="chip" data-a="size" data-v="${i}" aria-pressed="${i === ps.size}">${d[0]} × ${d[1]} cm</button>`).join('')}</div>`;
    } else if (ps.open === 'img') {
      const multi = ps.qty > 1, cr = ps.rot[multi ? ps.active : 0];
      h = `<span class="hint">${multi ? `Girá y encuadrá la foto del lugar ${ps.active + 1} (${esc(W[ps.slots[ps.active]].t)}) sin cambiar el cuadro.` : 'Girá o encuadrá la foto dentro del cuadro, sin cambiar su forma.'}</span>
        <div class="opts" style="align-items:center;gap:14px"><div class="rot"><button class="round" data-a="rot" data-v="-90" aria-label="Rotar a la izquierda"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 3v6h6"/></svg></button><span style="width:46px;text-align:center;font-weight:500">${cr}°</span><button class="round" data-a="rot" data-v="90" aria-label="Rotar a la derecha"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg></button></div>
        <button class="chip" data-a="fit" data-v="cover" aria-pressed="${ps.fit === 'cover'}">Llenar el cuadro</button><button class="chip" data-a="fit" data-v="contain" aria-pressed="${ps.fit === 'contain'}">Imagen completa</button></div>`;
    }
    t.innerHTML = h;
    const cc = $('customColor'); if (cc) cc.addEventListener('input', (e) => { ps.custom = e.target.value; ps.frame = 'custom'; ps.set = null; renderPieces(); renderDock(); });
  }

  function renderList() {
    const multi = ps.qty > 1;
    $('tObras').setAttribute('aria-selected', ps.tab === 'obras'); $('tSets').setAttribute('aria-selected', ps.tab === 'sets');
    $('tSets').hidden = !D.sets.length;
    if (ps.tab === 'obras') {
      $('phelp').textContent = multi ? `Elegí la obra para el lugar ${ps.active + 1}, o tocá un cuadro en la pared para cambiarlo.` : (mob() ? 'Tocá una obra para verla en la pared.' : 'Pasá el cursor para verla en la pared; tocá para elegirla.');
      const placed = ps.slots.slice(0, ps.qty);
      $('plist').innerHTML = W.map((w, i) => {
        const where = placed.map((p, k) => (p === i ? k + 1 : 0)).filter(Boolean);
        const tb = w.fmt === 'h' ? [54, 36] : [36, 54];
        return `<button class="prow${where.length ? ' on' : ''}" data-w="${i}"><span class="th"><img src="${w.sm}" alt="" loading="lazy" style="width:${tb[0]}px;height:${tb[1]}px"></span><span class="pt"><b>${esc(w.t)}</b><small>${esc([w.serie, w.place.split(',')[0], w.year].filter(Boolean).join(' · '))}</small></span>${where.length ? `<span class="badge">${multi ? where.join(' · ') : '✓'}</span>` : ''}</button>`;
      }).join('');
    } else {
      $('phelp').textContent = 'Combinaciones pensadas para colgar juntas. Elegí una y después cambiá lo que quieras.';
      $('plist').innerHTML = D.sets.map((s, k) => `<button class="setcard${ps.set === k ? ' on' : ''}" data-set="${k}"><span class="mini">${s.works.map((i) => { const tb = s.orient === 'h' ? [30, 20] : [20, 30]; return `<img src="${W[i].sm}" alt="" style="width:${tb[0]}px;height:${tb[1]}px">`; }).join('')}</span><span><b>${esc(s.name)}</b><small>${esc(s.desc)}</small></span></button>`).join('');
    }
    const isM = ps.finish === 'marco', d = SIZES[ps.orient][ps.size], fr = frameOf(), mt = MATS.find((m) => m.id === ps.mat), ed = EDGES.find((e) => e.id === ps.edge);
    const spec = `${isM ? 'marco ' + fr.label.toLowerCase() + ', ' + (mt.c ? 'paspartú ' + mt.label.toLowerCase() : 'sin paspartú') : 'canvas, borde ' + ed.label.toLowerCase()} · ${d[0]}×${d[1]} cm${ps.qty > 1 ? ' c/u' : ''}`;
    $('sum').textContent = `${ps.qty} ${ps.qty === 1 ? 'obra' : 'obras'} · ${spec}`;
    const names = ps.slots.slice(0, ps.qty).map((k) => W[k].t);
    $('consult').href = consultLink(`${ps.qty > 1 ? NAMES[ps.qty] + ': ' : ''}${names.join(' + ')} — ${spec}`);
  }

  function renderP() { if ($('v-probador').hidden) return; renderPieces(); renderDock(); renderList(); }

  $('dock').addEventListener('click', (e) => { e.stopPropagation(); act(e); });
  $('tray').addEventListener('click', (e) => { e.stopPropagation(); act(e); });
  $('stage').addEventListener('click', (e) => {
    const p = e.target.closest('[data-slot]');
    if (p) { ps.active = +p.dataset.slot; }
    if (ps.open) ps.open = null;
    renderP();
  });
  function act(e) {
    const b = e.target.closest('[data-a]'); if (!b) return;
    const a = b.dataset.a, v = b.dataset.v;
    if (a === 'open') { ps.open = ps.open === v ? null : v; renderDock(); return; }
    if (a === 'finish') up({ finish: v, open: ['marco', 'mat', 'edge'].includes(ps.open) ? null : ps.open });
    else if (a === 'qty') { const q = Math.max(1, Math.min(3, ps.qty + +v)); up({ qty: q, active: Math.min(ps.active, q - 1) }); }
    else if (a === 'frame') up({ frame: v });
    else if (a === 'mat') up({ mat: v });
    else if (a === 'edge') up({ edge: v });
    else if (a === 'orient') up({ orient: v });
    else if (a === 'size') up({ size: +v });
    else if (a === 'fit') up({ fit: v });
    else if (a === 'rot') { const k = ps.qty > 1 ? ps.active : 0; ps.rot[k] = (ps.rot[k] + +v + 360) % 360; up({}); }
  }
  $('tObras').onclick = () => { ps.tab = 'obras'; renderList(); };
  $('tSets').onclick = () => { ps.tab = 'sets'; renderList(); };
  $('plist').addEventListener('click', (e) => {
    const r = e.target.closest('[data-w]'), s = e.target.closest('[data-set]');
    if (r) { const i = +r.dataset.w; ps.slots[ps.active] = i; ps.rot[ps.active] = 0; ps.hover = null; ps.set = null; if (ps.qty > 1) ps.active = (ps.active + 1) % ps.qty; renderP(); if (mob()) $('stage').scrollIntoView({ behavior: 'smooth' }); }
    if (s) { const k = +s.dataset.set, st = D.sets[k]; Object.assign(ps, { qty: st.works.length, slots: st.works.concat(ps.slots).slice(0, 3), rot: [0, 0, 0], orient: st.orient, size: 1, finish: 'marco', frame: st.frame, mat: st.mat, fit: 'cover', active: 0, hover: null, open: null, set: k }); renderP(); }
  });
  $('plist').addEventListener('mouseover', (e) => { if (mob() || ps.tab !== 'obras') return; const r = e.target.closest('[data-w]'); if (r && ps.hover !== +r.dataset.w) { ps.hover = +r.dataset.w; renderPieces(); } });
  $('plist').addEventListener('mouseleave', () => { if (ps.hover !== null) { ps.hover = null; renderPieces(); } });
  let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (!$('v-probador').hidden) renderPieces(); }, 120); });

  /* ================= CONTACTO ================= */
  function consultLink(what) {
    const msg = `Hola! Me interesa: ${what}`;
    if (C.whatsapp) return `https://wa.me/${C.whatsapp.replace(/\D/g, '')}?text=${encodeURIComponent(msg)}`;
    if (C.instagram) return `https://instagram.com/${C.instagram.replace(/^@/, '')}`;
    if (C.email) return `mailto:${C.email}?subject=${encodeURIComponent('Consulta por obra')}&body=${encodeURIComponent(msg)}`;
    return '#contacto';
  }
  function renderAbout() {
    $('bio').textContent = C.bio || 'Fotografías de viaje impresas en marco o canvas: mar, atardeceres, jardines y ciudades de América, de California a Tigre.';
    const ln = [];
    if (C.whatsapp) ln.push(`<a class="ln" href="https://wa.me/${esc(C.whatsapp.replace(/\D/g, ''))}" target="_blank" rel="noopener"><span>WhatsApp</span><span>${esc(C.whatsapp)}</span></a>`);
    if (C.instagram) ln.push(`<a class="ln" href="https://instagram.com/${esc(C.instagram.replace(/^@/, ''))}" target="_blank" rel="noopener"><span>Instagram</span><span>${esc(C.instagram)}</span></a>`);
    if (C.email) ln.push(`<a class="ln" href="mailto:${esc(C.email)}"><span>Email</span><span>${esc(C.email)}</span></a>`);
    $('contacto').innerHTML = `<span class="eyebrow">Contacto</span>${ln.join('') || '<span class="ln"><span>Consultas</span><span>Datos de contacto próximamente</span></span>'}`;
    $('foot').textContent = `© ${new Date().getFullYear()} ${C.name}`;
  }

  renderAbout(); setView('map'); route();
})();
</script>
</body>
</html>
